<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <title>Carros e Bicicletas</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
    <h1 class="title">Carros e Bicicletas</h1>
    <div class="block">
        <h2 class="block_title">Carro: <span class="yellow">R$ 1999</span></h2>
        <p class="text">Carro modelo <span class="yellow">2045</span>, com <span class="yellow">200km</span> rodados.</p>
        <button class="button"><span class="button_text">Comprar Carro</span></button>
    </div>
    <div class="block">
        <h2 class="block_title">Bicicleta: <span class="yellow">R$ 199</span></h2>
        <p class="text">Carro modelo <span class="yellow">2050</span>, com <span class="yellow">20km</span> rodados.</p>
        <button class="button"><span class="button_text">Comprar Bicicleta</span></button>
    </div>
</body>

</html>
