<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Unidades - EM e REM</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div>
        <p class="px">Esse está em <em>px</em>.
        </p>
        <a class="px" href="/">Clique Aqui</a>
    </div>
    <div>
        <p class="rem">Esse está em <em>rem</em>.
        </p>
        <a class="rem" href="/">Clique Aqui</a>
    </div>
     <div>
        <p class="rem">Esse está em <em>em</em>.
        </p>
        <a class="em" href="/">Clique Aqui</a>
    </div>
</body>
</html>

<!-- em px é fixo, em REM é em relação ao html, em EM é em relação as "divs pai" -->
